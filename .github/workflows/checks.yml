name: checks

# The only automation in this repo. Plain shell: grep, diff, and unzip, with no
# package manager and no dependencies, because a CRAI pilot repo is Airtable
# configuration and Claude skills rather than a software project.
#
# It checks the things a human reviewer reliably skims past.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Every skill folder has a SKILL.md
        run: |
          fail=0
          found=0
          for dir in skills/*/; do
            found=1
            [ -f "$dir/SKILL.md" ] || { echo "::error::$dir has no SKILL.md"; fail=1; }
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::no skills found under skills/. A pilot ships at least one skill."
            exit 1
          fi
          exit $fail

      - name: Version stamps agree with each other and with the changelog
        run: |
          # The stamp is hand-edited in every SKILL.md at release time, so the failure
          # mode is editing some and forgetting others. All stamps must match, and they
          # must match the newest dated heading in CHANGELOG.md. Between releases that
          # heading is the last shipped version, which is what the stamps should still
          # say, so this holds while work is in flight too.
          fail=0
          for f in skills/*/SKILL.md; do
            n=$(grep -c '^\*\*Version:\*\*' "$f" || true)
            if [ "$n" -ne 1 ]; then
              echo "::error file=$f::expected exactly 1 version stamp, found $n"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || exit 1

          stamps=$(grep -h '^\*\*Version:\*\*' skills/*/SKILL.md | sed 's/^\*\*Version:\*\* *//; s/ *·.*//' | sort -u)
          if [ "$(echo "$stamps" | wc -l)" -ne 1 ]; then
            echo "::error::skills carry different versions:"
            grep -H '^\*\*Version:\*\*' skills/*/SKILL.md
            echo "Every skill ships the one release version. See docs/versioning.md."
            exit 1
          fi

          latest=$(grep -m1 -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md | tr -d '#[] ')
          if [ -z "$latest" ]; then
            echo "::error file=CHANGELOG.md::no dated version heading found"
            exit 1
          fi
          if [ "$stamps" != "$latest" ]; then
            echo "::error::skills are stamped $stamps but the newest CHANGELOG entry is $latest"
            echo "Bump every skills/*/SKILL.md stamp and the changelog together, in one commit."
            exit 1
          fi
          echo "all skills stamped $stamps, matching CHANGELOG.md"

      - name: README version stamp agrees with the skills and the changelog
        run: |
          # README.md carries its own "**Version:**" line under its H1, separate from
          # every SKILL.md's stamp, and the check above never looks at it: it globs
          # only skills/*/SKILL.md. That gap is how a real pilot shipped with every
          # skill and the changelog at 0.2.0 while its README still said 0.1.0, and
          # nothing caught it. This job exists so a pilot's own CI catches the same
          # contradiction if it develops one by hand.
          #
          # A missing README stamp is not an error here. This check is about
          # disagreement, not about mandating the line; a pilot without one has
          # nothing to disagree.
          if [ ! -f README.md ]; then
            echo "no README.md; nothing to check"
            exit 0
          fi

          readme_stamp=$(grep -m1 '^\*\*Version:\*\*' README.md || true)
          if [ -z "$readme_stamp" ]; then
            echo "no README.md version stamp found; nothing to check"
            exit 0
          fi
          readme_version=$(printf '%s' "$readme_stamp" | sed 's/^\*\*Version:\*\* *//; s/ *·.*//')

          skill_stamps=$(grep -h '^\*\*Version:\*\*' skills/*/SKILL.md 2>/dev/null \
                          | sed 's/^\*\*Version:\*\* *//; s/ *·.*//' | sort -u)
          if [ -n "$skill_stamps" ] && [ "$(printf '%s\n' "$skill_stamps" | wc -l)" -eq 1 ] \
             && [ "$readme_version" != "$skill_stamps" ]; then
            echo "::error file=README.md::README is stamped $readme_version but every skill is stamped $skill_stamps"
            echo "Update the **Version:** line under README.md's H1 to match, in the same commit as the release."
            exit 1
          fi

          latest=$(grep -m1 -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md | tr -d '#[] ')
          if [ -n "$latest" ] && [ "$readme_version" != "$latest" ]; then
            echo "::error file=README.md::README is stamped $readme_version but the newest CHANGELOG entry is $latest"
            echo "Update the **Version:** line under README.md's H1 to match the release, in the same commit."
            exit 1
          fi
          echo "README stamped $readme_version, matching the skills and CHANGELOG.md"

      - name: Packaged archives match their source folders
        run: |
          # install/ is what people actually download and install, so a stale archive
          # ships a bug that is already fixed in the source.
          fail=0
          for dir in skills/*/; do
            name=$(basename "$dir")
            archive="install/$name.skill"
            if [ ! -f "$archive" ]; then
              echo "::error::$archive is missing. Repackage skills/$name/ and commit it."
              fail=1
              continue
            fi
            work=$(mktemp -d)
            unzip -q "$archive" -d "$work"

            # Accept either packaging layout. This repo's package-skill.sh zips contents flat at
            # the archive root; crai-pilot-scaffold's own archive wraps them in a <name>/ folder
            # because it is unzipped into ~/.claude/skills/. Both are valid for their delivery
            # path, so detect rather than assume. Do not "fix" this back to a hardcoded layout.
            if [ -d "$work/$name" ] && [ "$(ls -A "$work" | wc -l | tr -d ' ')" -eq 1 ]; then
              root="$work/$name"
            else
              root="$work"
            fi

            if ! diff -r "$root" "skills/$name" >/dev/null 2>&1; then
              echo "::error::$archive does not match skills/$name/. Repackage it."
              diff -r "$root" "skills/$name" || true
              fail=1
            fi
          done
          for archive in install/*.skill; do
            [ -e "$archive" ] || continue
            name=$(basename "$archive" .skill)
            if [ ! -d "skills/$name" ]; then
              echo "::error::$archive has no skills/$name/ source. A renamed or removed skill leaves its old archive behind; delete it."
              fail=1
            fi
          done
          exit $fail

      - name: Frontmatter is valid and within packaging limits
        run: |
          # Both limits below were hit in practice on earlier CRAI pilots.
          fail=0
          for f in skills/*/SKILL.md; do
            name=$(basename "$(dirname "$f")")
            if [ "$(head -n1 "$f")" != "---" ]; then
              echo "::error file=$f::must open with a --- fenced frontmatter block"
              fail=1
              continue
            fi
            fm=$(awk 'NR>1{if($0=="---")exit; print}' "$f")

            declared=$(printf '%s\n' "$fm" | sed -n 's/^name:[[:space:]]*//p' | tr -d '"'"'"' ')
            if [ "$declared" != "$name" ]; then
              echo "::error file=$f::frontmatter name is \"$declared\" but the folder is \"$name\". They must match, or the packaged archive and the installed skill disagree about what it is called."
              fail=1
            fi

            desc=$(printf '%s\n' "$fm" | awk '/^description:/{f=1;sub(/^description:[[:space:]]*/,"")} /^[a-zA-Z0-9_-]+:/{if(f&&!/^description:/)f=0} f')
            if [ -z "$(printf '%s' "$desc" | tr -d '[:space:]')" ]; then
              echo "::error file=$f::frontmatter needs a description. It is what decides whether the skill triggers."
              fail=1
            fi
            len=$(printf '%s' "$desc" | wc -c | tr -d ' ')
            if [ "$len" -gt 1024 ]; then
              echo "::error file=$f::description is $len characters, over the 1024 limit. A description that long is usually two skills."
              fail=1
            fi

            # Catch unreplaced <placeholder> tokens, which is what actually breaks packaging.
            # Do NOT revert to a bare '[<>]' scan: it false-positives on the "description: >"
            # folded-scalar indicator this repo uses in every SKILL.md, and on prose like ">=".
            scan=$(printf '%s\n' "$fm" | grep -vE '^[a-zA-Z0-9_-]+:[[:space:]]*[>|][+-]?[[:space:]]*$')
            if printf '%s' "$scan" | grep -qE '<[A-Za-z0-9_-]+>'; then
              echo "::error file=$f::frontmatter contains an unreplaced <placeholder>. Use \"your-org-slug\" style instead."
              fail=1
            fi
          done
          exit $fail

      - name: No em dashes in added lines (ratchet)
        run: |
          # House style, and not only taste: a skill's prose is a prompt, and the model
          # reads the punctuation it is shown as a style signal. LICENSE and NOTICE are
          # exempt as canonical third-party text. Built with printf so this file does
          # not itself contain the character it bans.
          #
          # This checks only ADDED lines, not whole touched files. Pre-existing em
          # dashes are grandfathered, including elsewhere in the same file a change
          # happens to land in: a two-word heading fix should not have to justify
          # rewriting hundreds of lines of past release notes to go green. Any new
          # line must be clean, so the debt can only shrink over time, never by
          # demanding an unrelated rewrite of history to land an unrelated fix.
          em=$(printf '\xe2\x80\x94')

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi

          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then
            echo "no usable base commit (first commit on the branch); skipping ratchet"
            exit 0
          fi

          files=$(git diff --name-only "$base"...HEAD -- '*.md' '*.mjs' '*.yml' '*.py' | grep -v '^install/' || true)
          if [ -z "$files" ]; then
            echo "no changed prose files to check"
            exit 0
          fi

          hits=""
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            found=$(git diff --unified=0 "$base"...HEAD -- "$f" \
                      | grep '^+' | grep -v '^+++' \
                      | grep --binary-files=without-match "$em" | sed "s|^+|  $f: |" || true)
            [ -n "$found" ] && hits="$hits$found"$'\n'
          done <<< "$files"

          if [ -n "$hits" ]; then
            echo "::error::house style is no em dashes in lines added by this change. Use a colon, a semicolon, or parentheses."
            printf '%s' "$hits"
            exit 1
          fi
          echo "no em dashes in added lines"

      - name: Changelog is releasable
        run: |
          fail=0
          grep -qi '^## \[Unreleased\]' CHANGELOG.md || {
            echo "::error file=CHANGELOG.md::no [Unreleased] section. Keep one at the top so in-flight work has somewhere to land."
            fail=1
          }

          # Keep a Changelog shape with an ASCII hyphen, which is also house style.
          bad=$(grep -nE '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md \
                | grep -vE '^[0-9]+:## \[[0-9]+\.[0-9]+\.[0-9]+\] - [0-9]{4}-[0-9]{2}-[0-9]{2}[[:space:]]*$' || true)
          if [ -n "$bad" ]; then
            echo "::error file=CHANGELOG.md::version headings must read \"## [X.Y.Z] - YYYY-MM-DD\""
            echo "$bad"
            fail=1
          fi

          # The newest release states what it costs an already-installed operator.
          impact=$(awk '/^## \[[0-9]+\.[0-9]+\.[0-9]+\]/{f=1;next} /^## /{if(f)exit} f&&/^\*\*Operator impact:\*\*/{print;exit}' CHANGELOG.md)
          if [ -z "$impact" ]; then
            echo "::error file=CHANGELOG.md::the newest release has no \"**Operator impact:**\" line. Every release states in one line what an already-installed operator has to do. If you cannot write that line, this is probably two releases."
            fail=1
          elif ! printf '%s' "$impact" | grep -qi 'Operator impact:\*\*[[:space:]]*Reinstall'; then
            echo "::error file=CHANGELOG.md::the Operator impact line must begin with \"Reinstall\". Accepted forms:"
            echo '  **Operator impact:** Reinstall: none. Documentation only.'
            echo '  **Operator impact:** Reinstall: firm-review, email-generation.'
            echo '  **Operator impact:** Reinstall all skills + schema migration (see below).'
            echo "Found: $impact"
            fail=1
          fi
          exit $fail

      - name: Each archive contains exactly one SKILL.md
        run: |
          # Claude's skill uploader rejects any archive holding more than one
          # SKILL.md ("Zip must contain exactly one SKILL.md file"). The scaffolder that
          # wrote this pilot hit exactly that in a real upload, so the check travels
          # with every pilot. If a skill folder ever nests a second SKILL.md, this
          # fails here rather than when someone tries to install it.
          #
          # Matches SKILL.md at the archive root or nested one level: this repo's
          # packaging is flat, crai-pilot-scaffold's own archive is nested. Both are
          # valid; layout is not what this check is for.
          fail=0
          for archive in install/*.skill; do
            [ -e "$archive" ] || continue
            n=$(unzip -Z1 "$archive" | grep -cE '(^|/)SKILL\.md$')
            if [ "$n" -ne 1 ]; then
              echo "::error::$archive holds $n SKILL.md files, expected exactly 1. Claude's uploader refuses any other count."
              fail=1
            fi
          done
          exit $fail
